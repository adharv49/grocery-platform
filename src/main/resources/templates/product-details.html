<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title th:text="${product?.productName} + ' Details'">Product Details</title>
</head>
<body>
<div class="container my-5">

    <a th:href="@{/products}" class="btn btn-secondary btn-sm mb-4">
        <i class="fas fa-arrow-left"></i> Back to Products
    </a>

    <div th:if="${product != null}" class="row g-5">

        <div class="col-md-6">
            <img th:src="@{'/images/products/' + ${product?.productId} + '.jpg'}"
                 th:alt="${product?.productName}"
                 class="img-fluid rounded shadow-lg border">
        </div>

        <div class="col-md-6">
            <h1 th:text="${product?.productName}" class="mb-3 display-5">Product Name</h1>

            <h2 class="text-success mb-4"
                th:text="'₹' + ${#numbers.formatDecimal(product?.price ?: 0.00, 0, 'COMMA', 2, 'POINT')}">₹0.00</h2>

            <h3 class="h5 mb-3 text-primary">Product Specifications</h3>

            <ul class="list-group list-group-flush mb-4">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Category:</strong>
                    <span class="badge bg-secondary" th:text="${product?.category}">CATEGORY</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Current Status:</strong>
                    <span th:classappend="${product?.status == 'AVAILABLE' ? 'badge bg-success' : 'badge bg-warning'}"
                          th:text="${product?.status}">STATUS</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>Stock Available:</strong>
                    <span class="fw-bold" th:text="${product?.stockQuantity}">0</span> units
                </li>
            </ul>

            <form th:action="@{/cart/add}" method="post" class="d-flex align-items-center mt-4 p-3 border rounded bg-light">
                <input type="hidden" name="productId" th:value="${product?.productId}" />

                <label for="quantityDetail" class="form-label mb-0 me-3 fw-bold">Quantity:</label>
                <input type="number"
                       id="quantityDetail"
                       name="quantity"
                       value="1"
                       min="1"
                       max="99"
                       class="form-control me-3 text-center"
                       style="width: 80px;"
                       required />

                <button type="submit" class="btn btn-lg btn-success">
                    <i class="fas fa-cart-plus me-1"></i> Add to Cart
                </button>
            </form>
        </div>
    </div>

    <div th:unless="${product != null}" class="alert alert-danger my-5" role="alert">
        <h4 class="alert-heading">Product Not Found</h4>
        <p>The product ID requested could not be loaded. Please check the URL or return to the product catalog.</p>
        <hr>
        <a th:href="@{/products}" class="btn btn-danger">Go Back to Products</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
