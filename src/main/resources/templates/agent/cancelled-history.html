<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agent | Cancelled History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-dark: #2c3e50; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: var(--primary-dark); }
        .history-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 2rem; margin-top: 2rem; }
        .bg-cancelled { background-color: #fff5f5 !important; color: #c92a2a !important; border: 1px solid #ffc9c9; }
        .table thead th { background-color: #f1f3f5; color: #495057; font-size: 0.85rem; }
        .text-strike { text-decoration: line-through; color: #adb5bd; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/agent/tasks}">
            <i class="fas fa-arrow-left me-2"></i> BACK TO DASHBOARD
        </a>
    </div>
</nav>

<div class="container">
    <div class="history-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0"><i class="fas fa-ban text-danger me-2"></i>Cancelled History</h3>
                <p class="text-muted small">Logs of deliveries that were cancelled or failed.</p>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Address</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Note</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${cancelledDeliveries}">
                    <td class="fw-bold" th:text="${'#' + (d.order?.orderId ?: d.deliveryId)}"></td>
                    <td th:text="${d.order?.customer?.username}">Customer</td>
                    <td class="small text-muted" th:text="${d.deliveryAddress ?: d.order?.customer?.address}">Address</td>
                    <td class="text-strike" th:text="${'₹' + (d.order?.totalAmount ?: '0.00')}"></td>
                    <td>
                        <span class="badge bg-cancelled rounded-pill">CANCELLED</span>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border">No Collection Required</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(cancelledDeliveries)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="fas fa-history fa-2x mb-3"></i>
                        <p>No cancelled records found.</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
