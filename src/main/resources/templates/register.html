<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | GroceryMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .register-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid #f1f1f1;
        }
        .brand-logo {
            color: #198754;
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            font-size: 0.95rem;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
            border-color: #198754;
        }
        .btn-register {
            background-color: #198754;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-register:hover {
            background-color: #146c43;
            transform: translateY(-1px);
        }
        .input-group-text {
            background-color: #f8f9fa;
            color: #6c757d;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="brand-logo"><i class="fas fa-leaf me-2"></i>GroceryMart</div>
    <p class="text-center text-muted mb-4 small">Create your account to start shopping fresh.</p>

    <div class="alert alert-danger py-2 small border-0 mb-3" th:if="${error}">
        <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${error}">Error</span>
    </div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Username</label>
            <div class="input-group">
                <span class="input-group-text border-end-0"><i class="fas fa-user-tag"></i></span>
                <input type="text" name="username" class="form-control border-start-0"
                       placeholder="Choose a username" th:value="${enteredUsername}" required />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Email Address</label>
            <div class="input-group">
                <span class="input-group-text border-end-0"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control border-start-0"
                       placeholder="name@example.com" th:value="${enteredEmail}" required />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Residential Address</label>
            <div class="input-group">
                <span class="input-group-text border-end-0"><i class="fas fa-map-marker-alt"></i></span>
                <input type="text" name="address" class="form-control border-start-0"
                       placeholder="123 Fresh St, City" th:value="${enteredAddress}" required />
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">Password</label>
            <div class="input-group">
                <span class="input-group-text border-end-0"><i class="fas fa-key"></i></span>
                <input type="password" name="password" class="form-control border-start-0"
                       placeholder="Min. 6 characters" minlength="6" required />
            </div>
            <div class="text-danger mt-1" style="font-size: 11px;" th:if="${passError}">
                <i class="fas fa-info-circle me-1"></i> <span th:text="${passError}">Password error</span>
            </div>
        </div>

        <button type="submit" class="btn btn-register btn-success w-100 text-white shadow-sm mb-3">
            Create Account
        </button>
    </form>

    <div class="text-center mt-3">
        <p class="small text-muted">
            Already have an account? <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Login Here</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
