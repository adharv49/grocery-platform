<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed | GroceryMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow border-0 p-5">
                <div class="mb-4">
                    <i class="fas fa-check-circle text-success fa-5x"></i>
                </div>
                <h1 class="display-5 fw-bold">Order Confirmed!</h1>
                <p class="lead text-muted" th:text="${orderMessage}">Your order has been placed successfully.</p>

                <div class="alert alert-secondary my-4">
                    <strong>Order ID: </strong> <span th:text="${order.orderId}">#12345</span>
                </div>

                <div class="text-start mb-4">
                    <h5>Order Details</h5>
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Order Date:</span>
                            <span th:text="${order.orderDate}">2025-12-17</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Status:</span>
                            <span class="badge bg-primary" th:text="${order.status}">PLACED</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between fw-bold">
                            <span>Total Paid:</span>
                            <span th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0.00</span>
                        </li>
                    </ul>
                    <div class="address-section p-3 mb-4">
                        <h6 class="fw-bold"><i class="fas fa-map-marker-alt text-danger me-2"></i>Delivery Address</h6>
                        <p class="mb-0 small text-dark" th:text="${checkoutAddress}">
                            House No, Street Name, City, State - Zip
                        </p>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <a th:href="@{/products}" class="btn btn-primary btn-lg">Continue Shopping</a>
                    <a th:href="@{/orders/{id}/download(id=${order.orderId})}" class="btn btn-outline-secondary">
                        <i class="fas fa-file-pdf me-1"></i> Download Invoice
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
