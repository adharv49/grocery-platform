<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed | GroceryMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .success-icon { font-size: 4rem; color: #198754; }
        .order-card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .address-section { background-color: #f8f9fa; border-radius: 10px; padding: 15px; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="mb-4">
                <i class="fas fa-check-circle success-icon"></i>
                <h2 class="fw-bold mt-3">Order Placed Successfully!</h2>
                <p class="text-muted">Thank you for shopping with us. Your order is being processed.</p>
            </div>

            <div class="card order-card text-start">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between border-bottom pb-3 mb-3">
                        <h5 class="fw-bold">Order Summary</h5>
                        <span class="text-primary fw-bold" th:text="'#' + ${order.orderId}"></span>
                    </div>

                    <div class="row mb-4">
                        <div class="col-sm-6">
                            <p class="text-muted mb-1">Status</p>
                            <span class="badge bg-primary px-3" th:text="${order.status}">PLACED</span>
                        </div>
                        <div class="col-sm-6">
                            <p class="text-muted mb-1">Order Date</p>
                            <span class="fw-bold" th:text="${order.orderDate}">30 Dec 2025</span>
                        </div>
                    </div>

                    <div class="address-section mb-4">
                        <h6 class="fw-bold mb-2"><i class="fas fa-truck me-2 text-secondary"></i>Delivery Address</h6>
                        <p class="mb-0 text-dark" th:text="${checkoutAddress}">Customer Address</p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="fs-5 fw-bold">Total Amount Paid:</span>
                        <span class="fs-4 fw-bold text-success" th:text="'₹' + ${order.totalAmount}">₹0.00</span>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <a th:href="@{/products}" class="btn btn-outline-primary w-100">Continue Shopping</a>
                        </div>
                        <div class="col-6">
                            <a th:href="@{/orders/{id}/download(id=${order.orderId})}" class="btn btn-success w-100">
                                <i class="fas fa-file-pdf me-2"></i>Download Invoice
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
