<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Details | GroceryMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; }
        .bg-placed { background: #e3f2fd; color: #0d6efd; }
        .bg-shipped { background: #fff3e0; color: #ef6c00; }
        .bg-delivered { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Order <span th:text="'#' + ${order.orderId}">#123</span></h2>
        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back to Orders
        </a>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white fw-bold">Items Ordered</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">Product</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th class="text-end pe-4">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td class="ps-4" th:text="${item.productName}">Product</td>
                            <td th:text="'₹' + ${item.unitPrice}">₹0.00</td>
                            <td th:text="${item.quantity}">1</td>
                            <td class="text-end pe-4 fw-bold"
                                th:text="'₹' + ${item.unitPrice * item.quantity}">₹0.00</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase small fw-bold">Order Status</h6>
                    <div class="d-flex align-items-center mt-2">
                        <span th:class="'status-badge bg-' + ${#strings.toLowerCase(order.status)}"
                              th:text="${order.status}">PLACED</span>
                    </div>
                    <hr>
                    <h6 class="text-muted text-uppercase small fw-bold">Order Summary</h6>
                    <div class="d-flex justify-content-between mt-2">
                        <span>Total Paid</span>
                        <strong class="text-primary fs-5" th:text="'₹' + ${order.totalAmount}">₹0.00</strong>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white fw-bold">Delivery Address</div>
                <div class="card-body">
                    <p class="mb-1 fw-bold" th:text="${order.customer.username}">Customer Name</p>
                    <p class="text-muted mb-0">
                        <i class="fas fa-map-marker-alt text-danger me-2"></i>
                        <span th:text="${order.customer.address}">123, Street Name, City, State</span>
                    </p>
                </div>
            </div>

            <div class="d-grid gap-2">
                <a th:href="@{/orders/{id}/download(id=${order.orderId})}" class="btn btn-dark">
                    <i class="fas fa-file-pdf me-2"></i> Download Invoice
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
