<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | GroceryMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid #f1f1f1;
        }
        .brand-logo {
            color: #198754;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e0e0e0;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
            border-color: #198754;
        }
        .btn-login {
            background-color: #198754;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #146c43;
            transform: translateY(-1px);
        }
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #adb5bd;
            position: relative;
        }
        .divider::before {
            content: "";
            position: absolute;
            width: 40%;
            height: 1px;
            background: #e9ecef;
            left: 0;
            top: 50%;
        }
        .divider::after {
            content: "";
            position: absolute;
            width: 40%;
            height: 1px;
            background: #e9ecef;
            right: 0;
            top: 50%;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-logo"><i class="fas fa-leaf me-2"></i>GroceryMart</div>
    <p class="text-center text-muted mb-4">Welcome back! Please login.</p>

    <div th:if="${param.error}" class="alert alert-danger py-2 small border-0 mb-3" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i> Invalid username or password
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 small border-0 mb-3" role="alert">
        <i class="fas fa-check-circle me-2"></i> Successfully logged out
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-user"></i></span>
                <input type="text" name="username" class="form-control border-start-0" placeholder="Enter username" required />
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="Enter password" required />
            </div>
        </div>

        <button type="submit" class="btn btn-login btn-success w-100 mb-2 text-white shadow-sm">Login</button>
    </form>

    <div class="divider small">OR</div>

    <p class="text-center small text-muted mb-0">
        Don't have an account? <a th:href="@{/register}" class="text-success fw-bold text-decoration-none">Sign Up</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
